name: DSH npm publish

# Publishes integrations/deepseek-harness to npm as `dsh-boss-mode` through npm
# trusted publishing (GitHub OIDC): no NPM_TOKEN secret is stored, and CI never
# needs an interactive 2FA code. Provenance is generated from this workflow's
# OIDC identity.
#
# One-time setup, done interactively in the browser (2FA / security key):
#   https://www.npmjs.com/package/dsh-boss-mode/access → Trusted Publisher →
#   GitHub Actions
#     Organization or user: echoVic
#     Repository:           boss-skill
#     Workflow filename:    dsh-publish.yml
#     Environment:          (leave empty)
#     Permissions:          Allow direct publish
#
# Local publishing for accounts that only hold a WebAuthn security key (npm
# reject interactive 2FA on the CLI): stage the tarball with
#   npx npm@11 stage publish
# from integrations/deepseek-harness, then approve it under the npm profile menu
# → Staged Packages.

on:
  push:
    tags: ["dsh-boss-mode-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dsh-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish dsh-boss-mode to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11.21.2
      - name: Refuse a manual publish from a non-main branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "workflow_dispatch publishes only from main; got ${{ github.ref }}"
          exit 1
      - name: Install dependencies
        run: npm ci
      - name: Verify bundle snapshot and release tag
        run: |
          npm run dsh:check
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(
              fs.readFileSync("integrations/deepseek-harness/package.json", "utf8"),
            );
            const expected = `dsh-boss-mode-v${pkg.version}`;
            const ref = process.env.GITHUB_REF_NAME ?? "";
            if (ref.startsWith("dsh-boss-mode-v") && ref !== expected) {
              console.error(`tag ${ref} does not match bundle version ${pkg.version}`);
              process.exit(1);
            }
            console.log(`publishing ${pkg.name}@${pkg.version}`);
          '
      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish ./integrations/deepseek-harness --access public --provenance
